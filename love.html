<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>I Love You ❤️</title>
<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        height: 100vh;
    }

    canvas {
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.fillStyle = "#ffb6c1";
ctx.font = "bold 9px Arial";
ctx.textAlign = "center";

for (let scale = 11; scale < 17; scale++) {

    for (let i = 0; i < 120; i++) {

        let t = i * Math.PI * 2 / 120;

        let x = 16 * Math.sin(t) ** 3;

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        let px = canvas.width / 2 + x * scale * 3;
        let py = canvas.height / 2 - y * scale * 3;

        ctx.fillText("I love you", px, py);
    }
}
</script>
</body>
</html>
